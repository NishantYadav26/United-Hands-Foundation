name: Keep backend awake

# Render's free tier spins a service down after ~15 minutes of inactivity, and the
# cold start back up measures ~45s. That delay is long enough for the frontend's
# request timeout to fire, which is why the homepage impact stats used to render
# as zeros for the first visitor of the day. Pinging every 10 minutes keeps the
# instance warm so requests stay at their ~600ms warm baseline.
#
# Note: staying awake 24/7 consumes ~730 of Render's 750 free instance-hours per
# month. This is fine while the API is the only free service on the account — add
# another and the cap will be exceeded.

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

# Prevent overlapping runs if a ping is slow to return.
concurrency:
  group: keepalive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping API health endpoint
        run: |
          # --max-time 90 covers a full cold start; if the service was asleep this
          # request is the one that wakes it, and that is the point.
          code=$(curl -sS -o /dev/null -w '%{http_code}' \
                      --max-time 90 --retry 2 --retry-delay 15 \
                      https://united-hands-foundation.onrender.com/api/)
          echo "API responded with HTTP $code"
          # Any response at all means the instance is up. Only a total failure to
          # connect (000) should fail the job.
          if [ "$code" = "000" ]; then
            echo "::error::No response from API — service may be down."
            exit 1
          fi
